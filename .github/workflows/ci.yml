name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the secret scan reads the whole history
      # - rust-toolchain.toml sets the version, components and targets.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> out/cargo"
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          curl -sSfLo betterleaks.tar.gz https://github.com/betterleaks/betterleaks/releases/download/v1.9.0/betterleaks_1.9.0_linux_x64.tar.gz
          echo "f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7  betterleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf betterleaks.tar.gz -C /usr/local/bin betterleaks
          rm betterleaks.tar.gz
          bash tools/bootstrap_quality.sh
          npm install --global pnpm@12.2.1
          pnpm install --frozen-lockfile --ignore-scripts
          cargo fetch --locked
      - run: bash tools/check_linux.sh
      - run: bash tools/build_linux.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: out/release/*
          # ? Only the release job needs these files, right after the build.
          retention-days: 1
      # ? The plugin job packs these agents, so it doesn't build them again.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-agents
          path: out/cargo/*-unknown-linux-musl/release/myrig
          retention-days: 1

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # - fuzz/rust-toolchain.toml sets the nightly cargo-fuzz needs.
      - run: rustup toolchain install
        working-directory: fuzz
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "fuzz -> ../out/cargo"
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-fuzz@0.13.2
      - run: bash tools/fuzz.sh 30

  windows:
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ? rust-toolchain.toml sets the version, components and targets. The runner
      #   has the MSVC ARM64 tools and clang for aarch64.
      - run: |
          rustup toolchain install
          rustup target add aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> out/cargo"
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - run: ./tools/windows/check_windows.ps1
        shell: pwsh
      - run: ./tools/windows/build_windows.ps1 -Architectures x86_64,aarch64
        shell: pwsh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: out/release/*-windows.*
          retention-days: 1
      # - The plugin job packs these agents into the plugin zip.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-agents
          path: out/cargo/*-pc-windows-msvc/release/myrig.exe
          retention-days: 1

  plugin:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # ? The plugin build compiles offline from the registry fetched here.
      - run: |
          npm install --global pnpm@12.2.1
          pnpm install --frozen-lockfile --ignore-scripts
          cargo fetch --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-agents"
          path: out/cargo
          merge-multiple: true
      - run: bash tools/build_plugin.sh --prebuilt-linux --windows x86_64,aarch64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-plugin
          path: out/release/myrig-plugin-v*.zip
          retention-days: 1

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # ! Only a VERSION tag on main gets published. This is checked before anything
  #   builds.
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  build:
    needs: gate
    uses: ./.github/workflows/ci.yml

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      # * Build provenance: `gh attestation verify <file> -R <owner>/<repo>`.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          pattern: release-*
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.exe
            release/*.zip
            release/*.tar.gz
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          {
            echo '```text'
            sha256sum ./*.exe ./*.zip ./*.tar.gz
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" ./*.exe ./*.zip ./*.tar.gz \
            --title "Decky My Rig $GITHUB_REF_NAME" --notes-file notes.md --generate-notes

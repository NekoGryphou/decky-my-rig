[workspace]
members = ["crates/host-notifier", "crates/host-cli", "crates/host-core", "crates/host-windows", "crates/host-service", "crates/pairing-crypto", "crates/host-setup", "crates/protocol", "crates/client", "crates/client-linux", "crates/client-windows", "crates/client-cli", "crates/xtask"]
default-members = ["crates/host-service"]
resolver = "2"

[workspace.package]
# ! Matches VERSION; crates/xtask/src/version checks that.
version = "0.0.0"

[profile.release]
# ? Release files ship without symbols and are optimized across the whole program. The Linux binary
# ? is about 2.9 MB; the cost is slower release builds.
strip = "symbols"
lto = "fat"
codegen-units = 1

[profile.dev]
debug = "line-tables-only"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
auto-launch = "=0.6.0"
getrandom = "0.2"
http-body-util = "0.1"
libc = "0.2"
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
notify-rust = "=4.18.2"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
sha2 = { version = "=0.11.2", default-features = false }
subtle = { version = "2", default-features = false }
tempfile = "3"
tokio = { version = "=1.53.3", default-features = false, features = ["rt", "macros", "net", "time", "sync", "io-util"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }
uuid = { version = "1", default-features = false, features = ["std"] }
windows = { version = "0.62", default-features = false }
windows-service = "0.8"
windows-registry = "0.6"
zeroize = "=1.9.0"

myrig-host-core = { path = "crates/host-core" }
myrig-pairing-crypto = { path = "crates/pairing-crypto" }
myrig-protocol = { path = "crates/protocol" }
myrig-client = { path = "crates/client" }
myrig-client-linux = { path = "crates/client-linux" }
myrig-client-windows = { path = "crates/client-windows" }
myrig-host-windows = { path = "crates/host-windows" }

[package]
name = "myrig-client-windows"
version.workspace = true
edition = "2024"
publish = false

[dependencies]
myrig-client.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[dev-dependencies]
myrig-client = { workspace = true, features = ["testing"] }

[lints]
workspace = true

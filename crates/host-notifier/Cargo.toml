[package]
name = "myrig-notifier"
version.workspace = true
publish = false
edition = "2024"

[dependencies]
myrig-protocol.workspace = true
tokio.workspace = true
serde_json.workspace = true

# ? Windows only: otherwise notify-rust's Linux backend (zbus) would get built.
[target.'cfg(windows)'.dependencies]
auto-launch.workspace = true
myrig-host-windows.workspace = true
notify-rust.workspace = true

[lints]
workspace = true

[dev-dependencies]
# * The paused clock lets the timeout tests run without waiting in real time.
tokio = { workspace = true, features = ["test-util"] }

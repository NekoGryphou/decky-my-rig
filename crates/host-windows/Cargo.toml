[package]
name = "myrig-host-windows"
version.workspace = true
edition = "2024"
publish = false

[features]
# * The service itself. The host CLI, notifier and setup use the client half.
service = ["dep:myrig-host-core", "dep:socket2", "dep:system_shutdown"]

[dependencies]
myrig-protocol.workspace = true
myrig-host-core = { workspace = true, optional = true }
tokio.workspace = true
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
system_shutdown = { workspace = true, optional = true }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Memory", "Win32_System_WindowsProgramming", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Com", "Win32_System_EventLog", "Win32_UI_Shell", "Win32_System_IO", "Win32_System_RemoteDesktop", "Win32_NetworkManagement_NetManagement", "Win32_Networking_WinSock"] }
socket2 = { workspace = true, optional = true }
windows-service.workspace = true
windows-registry.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

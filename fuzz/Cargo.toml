[package]
name = "myrig-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# * Built only by cargo-fuzz on the toolchain in fuzz/rust-toolchain.toml.
[workspace]

[dependencies]
libfuzzer-sys = "=0.4.13"
myrig-client = { path = "../crates/client", features = ["testing"] }
myrig-client-linux = { path = "../crates/client-linux" }
myrig-host-core = { path = "../crates/host-core" }
myrig-protocol = { path = "../crates/protocol" }
serde_json = "1"
tokio = { version = "=1.53.3", default-features = false, features = ["rt", "io-util"] }

[[bin]]
name = "checked_json"
path = "fuzz_targets/checked_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "control_frame"
path = "fuzz_targets/control_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "control_reply"
path = "fuzz_targets/control_reply.rs"
test = false
doc = false
bench = false

[[bin]]
name = "local_control"
path = "fuzz_targets/local_control.rs"
test = false
doc = false
bench = false

[[bin]]
name = "host_config"
path = "fuzz_targets/host_config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "client_store"
path = "fuzz_targets/client_store.rs"
test = false
doc = false
bench = false

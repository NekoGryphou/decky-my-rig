[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
# - Tests assert (also to narrow types for mypy) and run fixed argument lists
#   of tools they need (openssl, cargo), never input from outside.
"tests/**" = ["S101", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
# - The plugin tests import their helpers as top-level modules, as unittest does.
mypy_path = ["tests/plugin"]

[[tool.mypy.overrides]]
module = "decky"
ignore_missing_imports = true

# - The plugin's own code is fully typed (strict mode's per-module flags).
[[tool.mypy.overrides]]
module = ["main", "my_rig.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
check_untyped_defs = true
warn_return_any = true
strict_equality = true
